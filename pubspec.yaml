name: bft_calculator
description: "Know your Basic Fitness Test Requirement for GAF"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/gaf.png"
  min_sdk_android: 36

flutter:
  uses-material-design: true
  assets: 
    - assets/gaf3.jpg
